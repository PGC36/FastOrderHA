server:
  port: 8084

spring:
  application:
    name: kitchen-service
  datasource:
    url: jdbc:postgresql://localhost:5444/kitchen_db
    username: kitchen_user
    password: kitchen123
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always

app:
  services:
    order-url: ${ORDER_SERVICE_URL:http://localhost:8082/orders}
