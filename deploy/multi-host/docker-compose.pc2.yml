services:
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: fastorder-etcd-1
    environment:
      ETCD_NAME: etcd-1
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://${PC2_IP}:2380
      ETCD_LISTEN_PEER_URLS: http://0.0.0.0:2380
      ETCD_ADVERTISE_CLIENT_URLS: http://${PC2_IP}:2379
      ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
      ETCD_INITIAL_CLUSTER: etcd-0=http://${PC1_IP}:2380,etcd-1=http://${PC2_IP}:2380,etcd-2=http://${PC3_IP}:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: fastorder-etcd-cluster
    command:
      - /usr/local/bin/etcd
      - --data-dir=/etcd-data
    volumes:
      - fastorder_etcd_1_data:/etcd-data
    ports:
      - "2379:2379"
      - "2380:2380"
    restart: unless-stopped

  fastorder-db-1:
    build:
      context: ../patroni-3nodes/patroni
    container_name: fastorder-db-1
    environment:
      FASTORDER_NODE_IP: ${PC2_IP}
      FASTORDER_POSTGRES_PORT: "6432"
      FASTORDER_PATRONI_API_PORT: "8108"
      FASTORDER_PATRONI_NAME: fastorder-db-1
      FASTORDER_ETCD_HOSTS: ${PC1_IP}:2379,${PC2_IP}:2379,${PC3_IP}:2379
      FASTORDER_POSTGRES_PASSWORD: fastorder123
      FASTORDER_REPLICATION_PASSWORD: replicator123
      FASTORDER_APP_DB: fastorder_db
      FASTORDER_APP_USER: fastorder_user
      FASTORDER_APP_PASSWORD: fastorder123
    command:
      - /bin/sh
      - -c
      - mkdir -p /var/lib/postgresql/data/pgdata /var/run/postgresql && chown -R postgres:postgres /var/lib/postgresql /var/run/postgresql && chmod 700 /var/lib/postgresql/data /var/lib/postgresql/data/pgdata && chmod 3775 /var/run/postgresql && exec gosu postgres sh -c 'envsubst < /etc/patroni/patroni.yml.tmpl > /tmp/patroni.yml && exec patroni /tmp/patroni.yml'
    volumes:
      - fastorder_db_1_data:/var/lib/postgresql/data
      - ../../database/fastorder-init.sql:/bootstrap/fastorder-init.sql:ro
      - ./patroni.yml.tmpl:/etc/patroni/patroni.yml.tmpl:ro
      - ../patroni-3nodes/scripts/post-bootstrap.sh:/scripts/post-bootstrap.sh:ro
    depends_on:
      - etcd-1
    ports:
      - "6432:5432"
      - "8108:8008"
    restart: unless-stopped

  fastorder-db-proxy-1:
    build:
      context: ../patroni-3nodes/haproxy
    container_name: fastorder-db-proxy-1
    environment:
      FASTORDER_PATRONI_NODE_1_IP: ${PC1_IP}
      FASTORDER_PATRONI_NODE_1_PORT: "5432"
      FASTORDER_PATRONI_NODE_1_API_PORT: "8008"
      FASTORDER_PATRONI_NODE_2_IP: ${PC2_IP}
      FASTORDER_PATRONI_NODE_2_PORT: "6432"
      FASTORDER_PATRONI_NODE_2_API_PORT: "8108"
      FASTORDER_PATRONI_NODE_3_IP: ${PC3_IP}
      FASTORDER_PATRONI_NODE_3_PORT: "5432"
      FASTORDER_PATRONI_NODE_3_API_PORT: "8008"
    command:
      - /bin/sh
      - -c
      - envsubst < /usr/local/etc/haproxy/haproxy.cfg.tmpl > /usr/local/etc/haproxy/haproxy.cfg && exec haproxy -W -db -f /usr/local/etc/haproxy/haproxy.cfg
    volumes:
      - ./haproxy.cfg.tmpl:/usr/local/etc/haproxy/haproxy.cfg.tmpl:ro
    ports:
      - "5432:5432"
      - "5433:5433"
      - "7000:7000"
    depends_on:
      - fastorder-db-1
    restart: unless-stopped

  postgres-exporter-db-1:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: fastorder-postgres-exporter-db-1
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:fastorder123@fastorder-db-1:5432/postgres?sslmode=disable
    depends_on:
      - fastorder-db-1
    ports:
      - "9188:9187"
    restart: unless-stopped

  postgres-exporter-db-proxy-1:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: fastorder-postgres-exporter-db-proxy-1
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:fastorder123@fastorder-db-proxy-1:5432/postgres?sslmode=disable
    depends_on:
      - fastorder-db-proxy-1
    ports:
      - "9189:9187"
    restart: unless-stopped

volumes:
  fastorder_etcd_1_data:
  fastorder_db_1_data:
