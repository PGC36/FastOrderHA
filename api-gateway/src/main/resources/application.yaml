server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: menu-service
              uri: ${FASTORDER_MENU_SERVICE_URL:http://menu-service:8081}
              predicates:
                - Path=/api/menu/**

            - id: order-service-root
              uri: ${FASTORDER_ORDER_SERVICE_URL:http://order-service:8082}
              predicates:
                - Path=/api/orders
              filters:
                - StripPrefix=1

            - id: order-service-paths
              uri: ${FASTORDER_ORDER_SERVICE_URL:http://order-service:8082}
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1

            - id: inventory-service
              uri: ${FASTORDER_INVENTORY_SERVICE_URL:http://inventory-service:8083}
              predicates:
                - Path=/api/inventory/**
              filters:
                - StripPrefix=1

            - id: kitchen-service
              uri: ${FASTORDER_KITCHEN_SERVICE_URL:http://kitchen-service:8084}
              predicates:
                - Path=/api/kitchen/**
              filters:
                - StripPrefix=1

            - id: delivery-service-root
              uri: ${FASTORDER_DELIVERY_SERVICE_URL:http://delivery-service:8085}
              predicates:
                - Path=/api/delivery
              filters:
                - RewritePath=/api/delivery, /deliveries

            - id: delivery-service-paths
              uri: ${FASTORDER_DELIVERY_SERVICE_URL:http://delivery-service:8085}
              predicates:
                - Path=/api/delivery/**
              filters:
                - RewritePath=/api/delivery/?(?<segment>.*), /deliveries/$\{segment}

            - id: notification-service-root
              uri: ${FASTORDER_NOTIFICATION_SERVICE_URL:http://notification-service:8086}
              predicates:
                - Path=/api/notifications
              filters:
                - StripPrefix=1

            - id: notification-service-paths
              uri: ${FASTORDER_NOTIFICATION_SERVICE_URL:http://notification-service:8086}
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=1

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
