server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:500ms}
      connect-timeout: ${SPRING_DATA_REDIS_CONNECT_TIMEOUT:500ms}

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: menu-service
              uri: http://menu-service:8081
              predicates:
                - Path=/api/menu/**

            - id: order-service-root
              uri: http://order-service:8082
              predicates:
                - Path=/api/orders
              filters:
                - StripPrefix=1

            - id: order-service-paths
              uri: http://order-service:8082
              predicates:
                - Path=/api/orders/**
              filters:
                - StripPrefix=1

            - id: inventory-service
              uri: http://inventory-service:8083
              predicates:
                - Path=/api/inventory/**
              filters:
                - StripPrefix=1

            - id: kitchen-service
              uri: http://kitchen-service:8084
              predicates:
                - Path=/api/kitchen/**
              filters:
                - StripPrefix=1

            - id: delivery-service-root
              uri: http://delivery-service:8085
              predicates:
                - Path=/api/delivery
              filters:
                - RewritePath=/api/delivery, /deliveries

            - id: delivery-service-paths
              uri: http://delivery-service:8085
              predicates:
                - Path=/api/delivery/**
              filters:
                - RewritePath=/api/delivery/?(?<segment>.*), /deliveries/$\{segment}

            - id: notification-service-root
              uri: http://notification-service:8086
              predicates:
                - Path=/api/notifications
              filters:
                - StripPrefix=1

            - id: notification-service-paths
              uri: http://notification-service:8086
              predicates:
                - Path=/api/notifications/**
              filters:
                - StripPrefix=1

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always

app:
  rate-limit:
    enabled: ${API_RATE_LIMIT_ENABLED:true}
    fail-open: ${API_RATE_LIMIT_FAIL_OPEN:true}
    capacity: ${API_RATE_LIMIT_CAPACITY:100000}
    window-seconds: ${API_RATE_LIMIT_WINDOW_SECONDS:60}
