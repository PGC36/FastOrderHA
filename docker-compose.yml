services:
  fastorder-db:
    image: postgres:16
    container_name: fastorder-db
    environment:
      POSTGRES_DB: fastorder_db
      POSTGRES_USER: fastorder_user
      POSTGRES_PASSWORD: fastorder123
    ports:
      - "5440:5432"
    volumes:
      - fastorder_db_data:/var/lib/postgresql/data
      - ./database/fastorder-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fastorder-network
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: fastorder-redis
    ports:
      - "6379:6379"
    networks:
      - fastorder-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fastorder-rabbitmq
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    networks:
      - fastorder-network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: fastorder-cadvisor
    ports:
      - "8087:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - fastorder-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    container_name: fastorder-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - rabbitmq
      - menu-service
      - inventory-service
      - notification-service
    networks:
      - fastorder-network
    restart: unless-stopped

  menu-service:
    build:
      context: ./menu-service
    container_name: fastorder-menu-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: fastorder-db
      DB_PORT: 5432
      DB_NAME: fastorder_db
      DB_USER: fastorder_user
      DB_PASSWORD: fastorder123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      - fastorder-db
      - rabbitmq
    networks:
      - fastorder-network
    restart: unless-stopped

  inventory-service:
    build:
      context: ./inventory-service
    container_name: fastorder-inventory-service
    ports:
      - "8083:8083"
    depends_on:
      - fastorder-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fastorder-db:5432/fastorder_db
      SPRING_DATASOURCE_USERNAME: fastorder_user
      SPRING_DATASOURCE_PASSWORD: fastorder123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    networks:
      - fastorder-network
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
    container_name: fastorder-order-service
    ports:
      - "8082:8082"
    depends_on:
      - fastorder-db
      - rabbitmq
      - inventory-service
      - kitchen-service
      - delivery-service
      - notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fastorder-db:5432/fastorder_db
      SPRING_DATASOURCE_USERNAME: fastorder_user
      SPRING_DATASOURCE_PASSWORD: fastorder123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      INVENTORY_SERVICE_URL: http://inventory-service:8083/inventory
      KITCHEN_SERVICE_URL: http://kitchen-service:8084/kitchen/orders
      DELIVERY_SERVICE_URL: http://delivery-service:8085/deliveries
      NOTIFICATION_SERVICE_URL: http://notification-service:8086/notifications
      ORDER_PROCESSING_MODE: event
    networks:
      - fastorder-network
    restart: unless-stopped

  kitchen-service:
    build:
      context: ./kitchen-service
    container_name: fastorder-kitchen-service
    ports:
      - "8084:8084"
    depends_on:
      - fastorder-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fastorder-db:5432/fastorder_db
      SPRING_DATASOURCE_USERNAME: fastorder_user
      SPRING_DATASOURCE_PASSWORD: fastorder123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      ORDER_SERVICE_URL: http://order-service:8082/orders
    networks:
      - fastorder-network
    restart: unless-stopped

  delivery-service:
    build:
      context: ./delivery-service
    container_name: fastorder-delivery-service
    ports:
      - "8085:8085"
    depends_on:
      - fastorder-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fastorder-db:5432/fastorder_db
      SPRING_DATASOURCE_USERNAME: fastorder_user
      SPRING_DATASOURCE_PASSWORD: fastorder123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      ORDER_SERVICE_URL: http://order-service:8082/orders
    networks:
      - fastorder-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
    container_name: fastorder-notification-service
    ports:
      - "8086:8086"
    depends_on:
      - fastorder-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fastorder-db:5432/fastorder_db
      SPRING_DATASOURCE_USERNAME: fastorder_user
      SPRING_DATASOURCE_PASSWORD: fastorder123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    networks:
      - fastorder-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: fastorder-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - api-gateway
      - cadvisor
      - rabbitmq
      - menu-service
      - inventory-service
      - order-service
      - kitchen-service
      - delivery-service
      - notification-service
    networks:
      - fastorder-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: fastorder-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - fastorder-network
    restart: unless-stopped

networks:
  fastorder-network:
    driver: bridge

volumes:
  fastorder_db_data:
  prometheus_data:
  grafana_data:
