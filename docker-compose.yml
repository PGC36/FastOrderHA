services:
  menu-db:
    image: postgres:16
    container_name: fastorder-menu-db
    environment:
      POSTGRES_DB: menu_db
      POSTGRES_USER: menu_user
      POSTGRES_PASSWORD: menu123
    ports:
      - "5441:5432"
    volumes:
      - menu_db_data:/var/lib/postgresql/data
      - ./database/menu-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fastorder-network
    restart: unless-stopped

  inventory-db:
    image: postgres:16
    container_name: fastorder-inventory-db
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: inventory123
    ports:
      - "5442:5432"
    volumes:
      - inventory_db_data:/var/lib/postgresql/data
      - ./database/inventory-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fastorder-network
    restart: unless-stopped

  order-db:
    image: postgres:16
    container_name: fastorder-order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order123
    ports:
      - "5443:5432"
    volumes:
      - order_db_data:/var/lib/postgresql/data
      - ./database/order-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fastorder-network
    restart: unless-stopped

  kitchen-db:
    image: postgres:16
    container_name: fastorder-kitchen-db
    environment:
      POSTGRES_DB: kitchen_db
      POSTGRES_USER: kitchen_user
      POSTGRES_PASSWORD: kitchen123
    ports:
      - "5444:5432"
    volumes:
      - kitchen_db_data:/var/lib/postgresql/data
      - ./database/kitchen-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fastorder-network
    restart: unless-stopped

  delivery-db:
    image: postgres:16
    container_name: fastorder-delivery-db
    environment:
      POSTGRES_DB: delivery_db
      POSTGRES_USER: delivery_user
      POSTGRES_PASSWORD: delivery123
    ports:
      - "5445:5432"
    volumes:
      - delivery_db_data:/var/lib/postgresql/data
      - ./database/delivery-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fastorder-network
    restart: unless-stopped

  notification-db:
    image: postgres:16
    container_name: fastorder-notification-db
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: notification_user
      POSTGRES_PASSWORD: notification123
    ports:
      - "5446:5432"
    volumes:
      - notification_db_data:/var/lib/postgresql/data
      - ./database/notification-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fastorder-network
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: fastorder-redis
    ports:
      - "6379:6379"
    networks:
      - fastorder-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fastorder-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - fastorder-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    container_name: fastorder-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - rabbitmq
      - menu-service
      - inventory-service
      - notification-service
    networks:
      - fastorder-network
    restart: unless-stopped

  menu-service:
    build:
      context: ./menu-service
    container_name: fastorder-menu-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: menu-db
      DB_PORT: 5432
      DB_NAME: menu_db
      DB_USER: menu_user
      DB_PASSWORD: menu123
    depends_on:
      - menu-db
    networks:
      - fastorder-network
    restart: unless-stopped

  inventory-service:
    build:
      context: ./inventory-service
    container_name: fastorder-inventory-service
    ports:
      - "8083:8083"
    depends_on:
      - inventory-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db:5432/inventory_db
      SPRING_DATASOURCE_USERNAME: inventory_user
      SPRING_DATASOURCE_PASSWORD: inventory123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    networks:
      - fastorder-network
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
    container_name: fastorder-order-service
    ports:
      - "8082:8082"
    depends_on:
      - order-db
      - rabbitmq
      - inventory-service
      - kitchen-service
      - delivery-service
      - notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/order_db
      SPRING_DATASOURCE_USERNAME: order_user
      SPRING_DATASOURCE_PASSWORD: order123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      INVENTORY_SERVICE_URL: http://inventory-service:8083/inventory
      KITCHEN_SERVICE_URL: http://kitchen-service:8084/kitchen/orders
      DELIVERY_SERVICE_URL: http://delivery-service:8085/deliveries
      NOTIFICATION_SERVICE_URL: http://notification-service:8086/notifications
    networks:
      - fastorder-network
    restart: unless-stopped

  kitchen-service:
    build:
      context: ./kitchen-service
    container_name: fastorder-kitchen-service
    ports:
      - "8084:8084"
    depends_on:
      - kitchen-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://kitchen-db:5432/kitchen_db
      SPRING_DATASOURCE_USERNAME: kitchen_user
      SPRING_DATASOURCE_PASSWORD: kitchen123
      ORDER_SERVICE_URL: http://order-service:8082/orders
    networks:
      - fastorder-network
    restart: unless-stopped

  delivery-service:
    build:
      context: ./delivery-service
    container_name: fastorder-delivery-service
    ports:
      - "8085:8085"
    depends_on:
      - delivery-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://delivery-db:5432/delivery_db
      SPRING_DATASOURCE_USERNAME: delivery_user
      SPRING_DATASOURCE_PASSWORD: delivery123
      ORDER_SERVICE_URL: http://order-service:8082/orders
    networks:
      - fastorder-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
    container_name: fastorder-notification-service
    ports:
      - "8086:8086"
    depends_on:
      - notification-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notification_db
      SPRING_DATASOURCE_USERNAME: notification_user
      SPRING_DATASOURCE_PASSWORD: notification123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    networks:
      - fastorder-network
    restart: unless-stopped

networks:
  fastorder-network:
    driver: bridge

volumes:
  menu_db_data:
  inventory_db_data:
  order_db_data:
  kitchen_db_data:
  delivery_db_data:
  notification_db_data:
