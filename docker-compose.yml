services:
  fastorder-db-0:
    image: docker.io/bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2
    container_name: fastorder-db-0
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: fastorder123
      POSTGRESQL_USERNAME: fastorder_user
      POSTGRESQL_PASSWORD: fastorder123
      POSTGRESQL_DATABASE: fastorder_db
      POSTGRESQL_MAX_CONNECTIONS: 300
      POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: 1
      REPMGR_PRIMARY_HOST: fastorder-db-0
      REPMGR_PARTNER_NODES: fastorder-db-0,fastorder-db-1
      REPMGR_NODE_ID: 1000
      REPMGR_NODE_NAME: fastorder-db-0
      REPMGR_NODE_NETWORK_NAME: fastorder-db-0
      REPMGR_USERNAME: repmgr
      REPMGR_PASSWORD: repmgr123
    volumes:
      - fastorder_db_0_data:/bitnami/postgresql
      - ./database/fastorder-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fastorder-network
    restart: always

  fastorder-db-1:
    image: docker.io/bitnamilegacy/postgresql-repmgr:17.6.0-debian-12-r2
    container_name: fastorder-db-1
    environment:
      POSTGRESQL_POSTGRES_PASSWORD: fastorder123
      POSTGRESQL_USERNAME: fastorder_user
      POSTGRESQL_PASSWORD: fastorder123
      POSTGRESQL_DATABASE: fastorder_db
      POSTGRESQL_MAX_CONNECTIONS: 300
      POSTGRESQL_NUM_SYNCHRONOUS_REPLICAS: 1
      REPMGR_PRIMARY_HOST: fastorder-db-0
      REPMGR_PARTNER_NODES: fastorder-db-0,fastorder-db-1
      REPMGR_NODE_ID: 1001
      REPMGR_NODE_NAME: fastorder-db-1
      REPMGR_NODE_NETWORK_NAME: fastorder-db-1
      REPMGR_USERNAME: repmgr
      REPMGR_PASSWORD: repmgr123
    volumes:
      - fastorder_db_1_data:/bitnami/postgresql
    depends_on:
      - fastorder-db-0
    networks:
      - fastorder-network
    restart: always

  fastorder-db:
    image: docker.io/bitnamilegacy/pgpool:4.6.3-debian-12-r0
    container_name: fastorder-db
    ports:
      - "5440:5432"
    environment:
      PGPOOL_BACKEND_NODES: 0:fastorder-db-0:5432,1:fastorder-db-1:5432
      PGPOOL_SR_CHECK_USER: repmgr
      PGPOOL_SR_CHECK_PASSWORD: repmgr123
      PGPOOL_POSTGRES_USERNAME: postgres
      PGPOOL_POSTGRES_PASSWORD: fastorder123
      PGPOOL_ADMIN_USERNAME: admin
      PGPOOL_ADMIN_PASSWORD: pgpooladmin123
      PGPOOL_ENABLE_LOAD_BALANCING: "no"
      PGPOOL_FAILOVER_ON_BACKEND_ERROR: "yes"
      PGPOOL_NUM_INIT_CHILDREN: "180"
      PGPOOL_MAX_POOL: "1"
      PGPOOL_POSTGRES_CUSTOM_USERS: fastorder_user
      PGPOOL_POSTGRES_CUSTOM_PASSWORDS: fastorder123
    depends_on:
      - fastorder-db-0
      - fastorder-db-1
    healthcheck:
      test: ["CMD", "/opt/bitnami/scripts/pgpool/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fastorder-network
    restart: always

  db-recovery:
    image: docker:27-cli
    container_name: fastorder-db-recovery
    command: >
      sh -c 'while true; do
        for container in fastorder-db fastorder-db-0 fastorder-db-1 fastorder-api-gateway fastorder-menu-service fastorder-inventory-service fastorder-order-service fastorder-kitchen-service fastorder-delivery-service fastorder-notification-service; do
          status=$$(docker inspect -f "{{.State.Status}}" "$$container" 2>/dev/null || echo missing);
          health=$$(docker inspect -f "{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}" "$$container" 2>/dev/null || echo none);
          if [ "$$status" != "running" ]; then
            echo "Recovering $$container because status=$$status";
            docker start "$$container" || true;
          elif [ "$$container" = "fastorder-db" ] && [ "$$health" = "unhealthy" ]; then
            echo "Recovering $$container because health=$$health";
            docker restart "$$container" || true;
          fi;
        done;
        sleep 10;
      done'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - fastorder-db
      - fastorder-db-0
      - fastorder-db-1
    networks:
      - fastorder-network
    restart: always

  postgres-backup:
    image: postgres:17-alpine
    container_name: fastorder-postgres-backup
    environment:
      PGHOST: fastorder-db
      PGPORT: "5432"
      PGDATABASE: fastorder_db
      PGUSER: fastorder_user
      PGPASSWORD: fastorder123
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: "300"
      BACKUP_RETENTION_COUNT: "10"
    volumes:
      - ./database/backup/backup.sh:/scripts/backup.sh:ro
      - ./backups/postgres:/backups
    command: ["sh", "/scripts/backup.sh"]
    depends_on:
      - fastorder-db
    networks:
      - fastorder-network
    restart: unless-stopped

  postgres-exporter-db-0:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: fastorder-postgres-exporter-db-0
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:fastorder123@fastorder-db-0:5432/fastorder_db?sslmode=disable
    depends_on:
      - fastorder-db-0
    networks:
      - fastorder-network
    restart: unless-stopped

  postgres-exporter-db-1:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: fastorder-postgres-exporter-db-1
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:fastorder123@fastorder-db-1:5432/fastorder_db?sslmode=disable
    depends_on:
      - fastorder-db-1
    networks:
      - fastorder-network
    restart: unless-stopped

  postgres-exporter-pgpool:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: fastorder-postgres-exporter-pgpool
    environment:
      DATA_SOURCE_NAME: postgresql://postgres:fastorder123@fastorder-db:5432/fastorder_db?sslmode=disable
    depends_on:
      - fastorder-db
    networks:
      - fastorder-network
    restart: unless-stopped

  dlq-recovery:
    image: node:24-alpine
    container_name: fastorder-dlq-recovery
    working_dir: /app
    command: ["node", "requeue-dlq.js", "--watch"]
    environment:
      RABBIT_URL: http://rabbitmq:15672/api
      RABBIT_USER: guest
      RABBIT_PASSWORD: guest
      INTERVAL_SECONDS: "15"
      BATCH_SIZE: "100"
    volumes:
      - ./monitoring/requeue-dlq.js:/app/requeue-dlq.js:ro
    depends_on:
      - rabbitmq
    networks:
      - fastorder-network
    restart: always

  redis:
    image: redis:7
    container_name: fastorder-redis
    ports:
      - "6379:6379"
    networks:
      - fastorder-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fastorder-rabbitmq
    command: >
      bash -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    networks:
      - fastorder-network
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: fastorder-cadvisor
    ports:
      - "8087:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    networks:
      - fastorder-network
    restart: unless-stopped

  docker-stats-exporter:
    image: node:24-alpine
    container_name: fastorder-docker-stats-exporter
    working_dir: /app
    command: ["node", "docker-stats-exporter.js"]
    environment:
      PORT: "9104"
      CONTAINER_FILTER: "^fastorder-(api-gateway|menu-service|inventory-service|order-service|kitchen-service|delivery-service|notification-service)$"
    volumes:
      - ./monitoring/docker-stats-exporter.js:/app/docker-stats-exporter.js:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - fastorder-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    container_name: fastorder-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - rabbitmq
      - menu-service
      - inventory-service
      - notification-service
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_TIMEOUT: 500ms
      SPRING_DATA_REDIS_CONNECT_TIMEOUT: 500ms
      API_RATE_LIMIT_ENABLED: "true"
      API_RATE_LIMIT_FAIL_OPEN: "true"
      API_RATE_LIMIT_CAPACITY: "100000"
      API_RATE_LIMIT_WINDOW_SECONDS: "60"
    networks:
      - fastorder-network
    restart: unless-stopped

  menu-service:
    build:
      context: ./menu-service
    container_name: fastorder-menu-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: fastorder-db
      DB_PORT: 5432
      DB_NAME: fastorder_db
      DB_USER: fastorder_user
      DB_PASSWORD: fastorder123
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_ATTEMPTS: 12
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_INITIAL_INTERVAL: 2000
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MULTIPLIER: 1.5
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_INTERVAL: 15000
    depends_on:
      - fastorder-db
      - rabbitmq
    networks:
      - fastorder-network
    restart: unless-stopped

  inventory-service:
    build:
      context: ./inventory-service
    container_name: fastorder-inventory-service
    ports:
      - "8083:8083"
    depends_on:
      - fastorder-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fastorder-db:5432/fastorder_db
      SPRING_DATASOURCE_USERNAME: fastorder_user
      SPRING_DATASOURCE_PASSWORD: fastorder123
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 25
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 5
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH: 50
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: 16
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: 32
      INVENTORY_ORDER_CREATED_CONSUMERS: 16
      INVENTORY_DELIVERY_COMPLETED_CONSUMERS: 16
      LOGGING_LEVEL_COM_EXAMPLE_INVENTORY_SERVICE: WARN
    networks:
      - fastorder-network
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
    container_name: fastorder-order-service
    ports:
      - "8082:8082"
    depends_on:
      - fastorder-db
      - rabbitmq
      - inventory-service
      - kitchen-service
      - delivery-service
      - notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fastorder-db:5432/fastorder_db
      SPRING_DATASOURCE_USERNAME: fastorder_user
      SPRING_DATASOURCE_PASSWORD: fastorder123
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 35
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 8
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH: 50
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: 16
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: 32
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_ATTEMPTS: 12
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_INITIAL_INTERVAL: 2000
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MULTIPLIER: 1.5
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_INTERVAL: 15000
      ORDER_WORKFLOW_EVENT_CONSUMERS: 16
      ORDER_OUTBOX_PUBLISHER_DELAY_MS: 50
      ORDER_OUTBOX_PUBLISHER_BATCH_SIZE: 1000
      INVENTORY_SERVICE_URL: http://inventory-service:8083/inventory
      KITCHEN_SERVICE_URL: http://kitchen-service:8084/kitchen/orders
      DELIVERY_SERVICE_URL: http://delivery-service:8085/deliveries
      NOTIFICATION_SERVICE_URL: http://notification-service:8086/notifications
      ORDER_PROCESSING_MODE: event
      LOGGING_LEVEL_COM_FASTORDER_ORDERSERVICE: WARN
    networks:
      - fastorder-network
    restart: unless-stopped

  kitchen-service:
    build:
      context: ./kitchen-service
    container_name: fastorder-kitchen-service
    ports:
      - "8084:8084"
    depends_on:
      - fastorder-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fastorder-db:5432/fastorder_db
      SPRING_DATASOURCE_USERNAME: fastorder_user
      SPRING_DATASOURCE_PASSWORD: fastorder123
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 25
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 5
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH: 50
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: 16
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: 32
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_ATTEMPTS: 12
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_INITIAL_INTERVAL: 2000
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MULTIPLIER: 1.5
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_INTERVAL: 15000
      KITCHEN_INVENTORY_RESERVED_CONSUMERS: 16
      ORDER_SERVICE_URL: http://order-service:8082/orders
      LOGGING_LEVEL_COM_FASTORDER_KITCHEN: WARN
    networks:
      - fastorder-network
    restart: unless-stopped

  delivery-service:
    build:
      context: ./delivery-service
    container_name: fastorder-delivery-service
    ports:
      - "8085:8085"
    depends_on:
      - fastorder-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fastorder-db:5432/fastorder_db
      SPRING_DATASOURCE_USERNAME: fastorder_user
      SPRING_DATASOURCE_PASSWORD: fastorder123
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 25
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 5
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH: 50
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: 16
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: 32
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_ATTEMPTS: 12
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_INITIAL_INTERVAL: 2000
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MULTIPLIER: 1.5
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_INTERVAL: 15000
      DELIVERY_KITCHEN_READY_CONSUMERS: 16
      ORDER_SERVICE_URL: http://order-service:8082/orders
      LOGGING_LEVEL_COM_FASTORDER_DELIVERY: WARN
    networks:
      - fastorder-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
    container_name: fastorder-notification-service
    ports:
      - "8086:8086"
    depends_on:
      - fastorder-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fastorder-db:5432/fastorder_db
      SPRING_DATASOURCE_USERNAME: fastorder_user
      SPRING_DATASOURCE_PASSWORD: fastorder123
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 15
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 3
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH: 50
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: 16
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: 32
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_ATTEMPTS: 12
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_INITIAL_INTERVAL: 2000
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MULTIPLIER: 1.5
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_INTERVAL: 15000
      NOTIFICATION_CREATED_CONSUMERS: 16
      LOGGING_LEVEL_COM_EXAMPLE_DEMO: WARN
    networks:
      - fastorder-network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: fastorder-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - api-gateway
      - cadvisor
      - docker-stats-exporter
      - rabbitmq
      - postgres-exporter-db-0
      - postgres-exporter-db-1
      - postgres-exporter-pgpool
      - menu-service
      - inventory-service
      - order-service
      - kitchen-service
      - delivery-service
      - notification-service
    networks:
      - fastorder-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    container_name: fastorder-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - fastorder-network
    restart: unless-stopped

networks:
  fastorder-network:
    driver: bridge

volumes:
  fastorder_db_0_data:
  fastorder_db_1_data:
  prometheus_data:
  grafana_data:
