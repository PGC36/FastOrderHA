services:
  fastorder-db:
    image: postgres:16
    container_name: fastorder-db
    environment:
      POSTGRES_DB: fastorder_db
      POSTGRES_USER: fastorder_user
      POSTGRES_PASSWORD: fastorder123
    ports:
      - "5440:5432"
    volumes:
      - fastorder_db_data:/var/lib/postgresql/data
      - ./database/fastorder-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fastorder-network
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: fastorder-redis
    ports:
      - "6379:6379"
    networks:
      - fastorder-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fastorder-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - fastorder-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    container_name: fastorder-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - redis
      - rabbitmq
      - menu-service
      - inventory-service
      - notification-service
    networks:
      - fastorder-network
    restart: unless-stopped

  menu-service:
    build:
      context: ./menu-service
    container_name: fastorder-menu-service
    ports:
      - "8081:8081"
    environment:
      DB_HOST: fastorder-db
      DB_PORT: 5432
      DB_NAME: fastorder_db
      DB_USER: fastorder_user
      DB_PASSWORD: fastorder123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    depends_on:
      - fastorder-db
      - rabbitmq
    networks:
      - fastorder-network
    restart: unless-stopped

  inventory-service:
    build:
      context: ./inventory-service
    container_name: fastorder-inventory-service
    ports:
      - "8083:8083"
    depends_on:
      - fastorder-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fastorder-db:5432/fastorder_db
      SPRING_DATASOURCE_USERNAME: fastorder_user
      SPRING_DATASOURCE_PASSWORD: fastorder123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    networks:
      - fastorder-network
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
    container_name: fastorder-order-service
    ports:
      - "8082:8082"
    depends_on:
      - fastorder-db
      - rabbitmq
      - inventory-service
      - kitchen-service
      - delivery-service
      - notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fastorder-db:5432/fastorder_db
      SPRING_DATASOURCE_USERNAME: fastorder_user
      SPRING_DATASOURCE_PASSWORD: fastorder123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      INVENTORY_SERVICE_URL: http://inventory-service:8083/inventory
      KITCHEN_SERVICE_URL: http://kitchen-service:8084/kitchen/orders
      DELIVERY_SERVICE_URL: http://delivery-service:8085/deliveries
      NOTIFICATION_SERVICE_URL: http://notification-service:8086/notifications
    networks:
      - fastorder-network
    restart: unless-stopped

  kitchen-service:
    build:
      context: ./kitchen-service
    container_name: fastorder-kitchen-service
    ports:
      - "8084:8084"
    depends_on:
      - fastorder-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fastorder-db:5432/fastorder_db
      SPRING_DATASOURCE_USERNAME: fastorder_user
      SPRING_DATASOURCE_PASSWORD: fastorder123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      ORDER_SERVICE_URL: http://order-service:8082/orders
    networks:
      - fastorder-network
    restart: unless-stopped

  delivery-service:
    build:
      context: ./delivery-service
    container_name: fastorder-delivery-service
    ports:
      - "8085:8085"
    depends_on:
      - fastorder-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fastorder-db:5432/fastorder_db
      SPRING_DATASOURCE_USERNAME: fastorder_user
      SPRING_DATASOURCE_PASSWORD: fastorder123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      ORDER_SERVICE_URL: http://order-service:8082/orders
    networks:
      - fastorder-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
    container_name: fastorder-notification-service
    ports:
      - "8086:8086"
    depends_on:
      - fastorder-db
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://fastorder-db:5432/fastorder_db
      SPRING_DATASOURCE_USERNAME: fastorder_user
      SPRING_DATASOURCE_PASSWORD: fastorder123
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
    networks:
      - fastorder-network
    restart: unless-stopped

networks:
  fastorder-network:
    driver: bridge

volumes:
  fastorder_db_data:
