services:
  db-client-proxy:
    build:
      context: ./deploy/patroni-3nodes/haproxy
    container_name: fastorder-db-client-proxy
    ports:
      - "5440:5432"
      - "7001:7000"
    environment:
      FASTORDER_DB_PRIMARY_PROXY_HOST: ${FASTORDER_DB_PRIMARY_PROXY_HOST:-fastorder-db}
      FASTORDER_DB_PRIMARY_PROXY_PORT: ${FASTORDER_DB_PRIMARY_PROXY_PORT:-5432}
      FASTORDER_DB_SECONDARY_PROXY_HOST: ${FASTORDER_DB_SECONDARY_PROXY_HOST:-fastorder-db}
      FASTORDER_DB_SECONDARY_PROXY_PORT: ${FASTORDER_DB_SECONDARY_PROXY_PORT:-5432}
    command:
      - /bin/sh
      - -c
      - envsubst < /usr/local/etc/haproxy/haproxy.cfg.tmpl > /usr/local/etc/haproxy/haproxy.cfg && exec haproxy -W -db -f /usr/local/etc/haproxy/haproxy.cfg
    volumes:
      - ./deploy/multi-host/haproxy-app-client.cfg.tmpl:/usr/local/etc/haproxy/haproxy.cfg.tmpl:ro
    networks:
      - fastorder-network
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
    container_name: fastorder-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - menu-service
      - inventory-service
      - order-service
      - kitchen-service
      - delivery-service
      - notification-service
    networks:
      - fastorder-network
    restart: unless-stopped

  menu-service:
    build:
      context: ./menu-service
    container_name: fastorder-menu-service
    ports:
      - "8081:8081"
    depends_on:
      - db-client-proxy
    environment:
      DB_HOST: ${FASTORDER_DB_HOST:-fastorder-db-client-proxy}
      DB_PORT: ${FASTORDER_DB_PORT:-5432}
      DB_NAME: ${FASTORDER_DB_NAME:-fastorder_db}
      DB_USER: ${FASTORDER_DB_USER:-fastorder_user}
      DB_PASSWORD: ${FASTORDER_DB_PASSWORD:-fastorder123}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${FASTORDER_DB_HOST:-fastorder-db-client-proxy}:${FASTORDER_DB_PORT:-5432}/${FASTORDER_DB_NAME:-fastorder_db}?connectTimeout=${FASTORDER_DB_CONNECT_TIMEOUT_SECONDS:-10}&socketTimeout=${FASTORDER_DB_SOCKET_TIMEOUT_SECONDS:-30}&tcpKeepAlive=true
      SPRING_DATASOURCE_USERNAME: ${FASTORDER_DB_USER:-fastorder_user}
      SPRING_DATASOURCE_PASSWORD: ${FASTORDER_DB_PASSWORD:-fastorder123}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 5
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 1
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 10000
      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: 5000
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: 600000
      SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME: 30000
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_ATTEMPTS: 12
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_INITIAL_INTERVAL: 2000
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MULTIPLIER: 1.5
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_INTERVAL: 15000
      DB_WAIT_HOST: ${FASTORDER_DB_HOST:-fastorder-db-client-proxy}
      DB_WAIT_PORT: ${FASTORDER_DB_PORT:-5432}
      RABBIT_WAIT_HOST: rabbitmq
      RABBIT_WAIT_PORT: 5672
    command: ["bash", "/app/scripts/wait-for-dependencies.sh", "java", "-jar", "app.jar"]
    volumes:
      - ./deploy/scripts/wait-for-dependencies.sh:/app/scripts/wait-for-dependencies.sh:ro
    networks:
      - fastorder-network
    restart: unless-stopped

  inventory-service:
    build:
      context: ./inventory-service
    container_name: fastorder-inventory-service
    ports:
      - "8083:8083"
    depends_on:
      - db-client-proxy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${FASTORDER_DB_HOST:-fastorder-db-client-proxy}:${FASTORDER_DB_PORT:-5432}/${FASTORDER_DB_NAME:-fastorder_db}?connectTimeout=${FASTORDER_DB_CONNECT_TIMEOUT_SECONDS:-10}&socketTimeout=${FASTORDER_DB_SOCKET_TIMEOUT_SECONDS:-30}&tcpKeepAlive=true
      SPRING_DATASOURCE_USERNAME: ${FASTORDER_DB_USER:-fastorder_user}
      SPRING_DATASOURCE_PASSWORD: ${FASTORDER_DB_PASSWORD:-fastorder123}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 32
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 8
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 10000
      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: 5000
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: 600000
      SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME: 30000
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH: 10
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: 8
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: 16
      INVENTORY_ORDER_CREATED_CONSUMERS: 8
      INVENTORY_DELIVERY_COMPLETED_CONSUMERS: 8
      LOGGING_LEVEL_COM_EXAMPLE_INVENTORY_SERVICE: WARN
      DB_WAIT_HOST: ${FASTORDER_DB_HOST:-fastorder-db-client-proxy}
      DB_WAIT_PORT: ${FASTORDER_DB_PORT:-5432}
      RABBIT_WAIT_HOST: rabbitmq
      RABBIT_WAIT_PORT: 5672
    command: ["bash", "/app/scripts/wait-for-dependencies.sh", "java", "-jar", "app.jar"]
    volumes:
      - ./deploy/scripts/wait-for-dependencies.sh:/app/scripts/wait-for-dependencies.sh:ro
    networks:
      - fastorder-network
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
    container_name: fastorder-order-service
    ports:
      - "8082:8082"
    depends_on:
      - db-client-proxy
      - inventory-service
      - kitchen-service
      - delivery-service
      - notification-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${FASTORDER_DB_HOST:-fastorder-db-client-proxy}:${FASTORDER_DB_PORT:-5432}/${FASTORDER_DB_NAME:-fastorder_db}?connectTimeout=${FASTORDER_DB_CONNECT_TIMEOUT_SECONDS:-10}&socketTimeout=${FASTORDER_DB_SOCKET_TIMEOUT_SECONDS:-30}&tcpKeepAlive=true
      SPRING_DATASOURCE_USERNAME: ${FASTORDER_DB_USER:-fastorder_user}
      SPRING_DATASOURCE_PASSWORD: ${FASTORDER_DB_PASSWORD:-fastorder123}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 40
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 8
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 10000
      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: 5000
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: 600000
      SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME: 30000
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH: 25
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: 12
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: 24
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_ATTEMPTS: 12
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_INITIAL_INTERVAL: 2000
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MULTIPLIER: 1.5
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_INTERVAL: 15000
      ORDER_WORKFLOW_EVENT_CONSUMERS: 12
      ORDER_OUTBOX_PUBLISHER_DELAY_MS: 25
      ORDER_OUTBOX_PUBLISHER_BATCH_SIZE: 1500
      INVENTORY_SERVICE_URL: http://inventory-service:8083/inventory
      KITCHEN_SERVICE_URL: http://kitchen-service:8084/kitchen/orders
      DELIVERY_SERVICE_URL: http://delivery-service:8085/deliveries
      NOTIFICATION_SERVICE_URL: http://notification-service:8086/notifications
      ORDER_PROCESSING_MODE: event
      LOGGING_LEVEL_COM_FASTORDER_ORDERSERVICE: WARN
      DB_WAIT_HOST: ${FASTORDER_DB_HOST:-fastorder-db-client-proxy}
      DB_WAIT_PORT: ${FASTORDER_DB_PORT:-5432}
      RABBIT_WAIT_HOST: rabbitmq
      RABBIT_WAIT_PORT: 5672
    command: ["bash", "/app/scripts/wait-for-dependencies.sh", "java", "-jar", "app.jar"]
    volumes:
      - ./deploy/scripts/wait-for-dependencies.sh:/app/scripts/wait-for-dependencies.sh:ro
    networks:
      - fastorder-network
    restart: unless-stopped

  kitchen-service:
    build:
      context: ./kitchen-service
    container_name: fastorder-kitchen-service
    ports:
      - "8084:8084"
    depends_on:
      - db-client-proxy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${FASTORDER_DB_HOST:-fastorder-db-client-proxy}:${FASTORDER_DB_PORT:-5432}/${FASTORDER_DB_NAME:-fastorder_db}?connectTimeout=${FASTORDER_DB_CONNECT_TIMEOUT_SECONDS:-10}&socketTimeout=${FASTORDER_DB_SOCKET_TIMEOUT_SECONDS:-30}&tcpKeepAlive=true
      SPRING_DATASOURCE_USERNAME: ${FASTORDER_DB_USER:-fastorder_user}
      SPRING_DATASOURCE_PASSWORD: ${FASTORDER_DB_PASSWORD:-fastorder123}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 28
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 5
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 10000
      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: 5000
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: 600000
      SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME: 30000
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH: 25
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: 12
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: 24
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_ATTEMPTS: 12
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_INITIAL_INTERVAL: 2000
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MULTIPLIER: 1.5
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_INTERVAL: 15000
      KITCHEN_INVENTORY_RESERVED_CONSUMERS: 12
      ORDER_SERVICE_URL: http://order-service:8082/orders
      LOGGING_LEVEL_COM_FASTORDER_KITCHEN: WARN
      DB_WAIT_HOST: ${FASTORDER_DB_HOST:-fastorder-db-client-proxy}
      DB_WAIT_PORT: ${FASTORDER_DB_PORT:-5432}
      RABBIT_WAIT_HOST: rabbitmq
      RABBIT_WAIT_PORT: 5672
    command: ["bash", "/app/scripts/wait-for-dependencies.sh", "java", "-jar", "app.jar"]
    volumes:
      - ./deploy/scripts/wait-for-dependencies.sh:/app/scripts/wait-for-dependencies.sh:ro
    networks:
      - fastorder-network
    restart: unless-stopped

  delivery-service:
    build:
      context: ./delivery-service
    container_name: fastorder-delivery-service
    ports:
      - "8085:8085"
    depends_on:
      - db-client-proxy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${FASTORDER_DB_HOST:-fastorder-db-client-proxy}:${FASTORDER_DB_PORT:-5432}/${FASTORDER_DB_NAME:-fastorder_db}?connectTimeout=${FASTORDER_DB_CONNECT_TIMEOUT_SECONDS:-10}&socketTimeout=${FASTORDER_DB_SOCKET_TIMEOUT_SECONDS:-30}&tcpKeepAlive=true
      SPRING_DATASOURCE_USERNAME: ${FASTORDER_DB_USER:-fastorder_user}
      SPRING_DATASOURCE_PASSWORD: ${FASTORDER_DB_PASSWORD:-fastorder123}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 28
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 5
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 10000
      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: 5000
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: 600000
      SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME: 30000
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH: 25
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: 12
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: 24
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_ATTEMPTS: 12
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_INITIAL_INTERVAL: 2000
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MULTIPLIER: 1.5
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_INTERVAL: 15000
      DELIVERY_KITCHEN_READY_CONSUMERS: 12
      ORDER_SERVICE_URL: http://order-service:8082/orders
      LOGGING_LEVEL_COM_FASTORDER_DELIVERY: WARN
      DB_WAIT_HOST: ${FASTORDER_DB_HOST:-fastorder-db-client-proxy}
      DB_WAIT_PORT: ${FASTORDER_DB_PORT:-5432}
      RABBIT_WAIT_HOST: rabbitmq
      RABBIT_WAIT_PORT: 5672
    command: ["bash", "/app/scripts/wait-for-dependencies.sh", "java", "-jar", "app.jar"]
    volumes:
      - ./deploy/scripts/wait-for-dependencies.sh:/app/scripts/wait-for-dependencies.sh:ro
    networks:
      - fastorder-network
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
    container_name: fastorder-notification-service
    ports:
      - "8086:8086"
    depends_on:
      - db-client-proxy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${FASTORDER_DB_HOST:-fastorder-db-client-proxy}:${FASTORDER_DB_PORT:-5432}/${FASTORDER_DB_NAME:-fastorder_db}?connectTimeout=${FASTORDER_DB_CONNECT_TIMEOUT_SECONDS:-10}&socketTimeout=${FASTORDER_DB_SOCKET_TIMEOUT_SECONDS:-30}&tcpKeepAlive=true
      SPRING_DATASOURCE_USERNAME: ${FASTORDER_DB_USER:-fastorder_user}
      SPRING_DATASOURCE_PASSWORD: ${FASTORDER_DB_PASSWORD:-fastorder123}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: 20
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: 3
      SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT: 10000
      SPRING_DATASOURCE_HIKARI_VALIDATION_TIMEOUT: 5000
      SPRING_DATASOURCE_HIKARI_MAX_LIFETIME: 600000
      SPRING_DATASOURCE_HIKARI_KEEPALIVE_TIME: 30000
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: guest
      SPRING_RABBITMQ_PASSWORD: guest
      SPRING_RABBITMQ_LISTENER_SIMPLE_PREFETCH: 25
      SPRING_RABBITMQ_LISTENER_SIMPLE_CONCURRENCY: 12
      SPRING_RABBITMQ_LISTENER_SIMPLE_MAX_CONCURRENCY: 24
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_ATTEMPTS: 12
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_INITIAL_INTERVAL: 2000
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MULTIPLIER: 1.5
      SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_INTERVAL: 15000
      NOTIFICATION_CREATED_CONSUMERS: 12
      LOGGING_LEVEL_COM_EXAMPLE_DEMO: WARN
      DB_WAIT_HOST: ${FASTORDER_DB_HOST:-fastorder-db-client-proxy}
      DB_WAIT_PORT: ${FASTORDER_DB_PORT:-5432}
      RABBIT_WAIT_HOST: rabbitmq
      RABBIT_WAIT_PORT: 5672
    command: ["bash", "/app/scripts/wait-for-dependencies.sh", "java", "-jar", "app.jar"]
    volumes:
