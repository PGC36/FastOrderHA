spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:postgresql://localhost:5445/delivery_db
    username: delivery_user
    password: delivery123
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
