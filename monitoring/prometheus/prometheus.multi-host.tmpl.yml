global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: docker-stats
    static_configs:
      - targets:
          - docker-stats-exporter:9104

  - job_name: rabbitmq
    static_configs:
      - targets:
          - ${RABBITMQ_HOST}:15692

  - job_name: rabbitmq-per-object
    metrics_path: /metrics/per-object
    static_configs:
      - targets:
          - ${RABBITMQ_HOST}:15692

  - job_name: postgres-node
    static_configs:
      - targets:
          - ${PC1_IP}:9187
        labels:
          postgres_node: db-0
          postgres_host: ${PC1_IP}
      - targets:
          - ${PC2_IP}:9188
        labels:
          postgres_node: db-1
          postgres_host: ${PC2_IP}
      - targets:
          - ${PC3_IP}:9187
        labels:
          postgres_node: db-2
          postgres_host: ${PC3_IP}

  - job_name: postgres-proxy
    static_configs:
      - targets:
          - ${PC2_IP}:9189
        labels:
          proxy_node: proxy-1
          proxy_host: ${PC2_IP}
      - targets:
          - ${PC4_IP}:9187
        labels:
          proxy_node: proxy-2
          proxy_host: ${PC4_IP}

  - job_name: patroni
    metrics_path: /metrics
    static_configs:
      - targets:
          - ${PC1_IP}:8008
        labels:
          postgres_node: db-0
      - targets:
          - ${PC2_IP}:8108
        labels:
          postgres_node: db-1
      - targets:
          - ${PC3_IP}:8008
        labels:
          postgres_node: db-2

  - job_name: api-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ${APP_HOST}:8080

  - job_name: menu-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ${APP_HOST}:8081

  - job_name: order-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ${APP_HOST}:8082

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ${APP_HOST}:8083

  - job_name: kitchen-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ${APP_HOST}:8084

  - job_name: delivery-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ${APP_HOST}:8085

  - job_name: notification-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ${APP_HOST}:8086
