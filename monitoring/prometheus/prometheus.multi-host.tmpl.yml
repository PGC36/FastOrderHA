          - ${PC2_IP}:8082
        labels:
          service_name: order-service
          service_host: ${PC2_IP}
          service_node: pc2
      - targets:
          - ${PC3_IP}:8082
        labels:
          service_name: order-service
          service_host: ${PC3_IP}
          service_node: pc3

  - job_name: inventory-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ${PC2_IP}:8083
        labels:
          service_name: inventory-service
          service_host: ${PC2_IP}
          service_node: pc2
      - targets:
          - ${PC3_IP}:8083
